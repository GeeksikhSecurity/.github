name: Bug Report
description: Report a non-security bug, defect, or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not use this form for security vulnerabilities.** Report those privately via [GitHub Security Advisories](../../security/advisories/new) or the process in this org's [SECURITY.md](https://github.com/GeeksikhSecurity/.github/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment (OS, runtime version, etc.)
    validations:
      required: false
